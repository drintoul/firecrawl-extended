# SearXNG config for the firecrawl-extended stack.
# `use_default_settings` merges this on top of SearXNG's defaults.
use_default_settings: true

server:
  secret_key: "a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcdef0"
  limiter: false          # JSON API is consumed only inside the compose network
  image_proxy: true
  formats:
    - html
    - json                # required by Firecrawl's /search

search:
  safe_search: 0
  autocomplete: ""

ui:
  static_use_hash: true
