name: firecrawl-extended

# Firecrawl (open-source, self-hosted) + extended interact/extract stack.
#
#   - gateway             the single external REST interface (:18080)
#   - mcp                 MCP server, Streamable HTTP (:18081)
#   - interact            custom Playwright session/interact service
#   - api                 upstream Firecrawl API + workers (NuQ/PG queue)
#   - playwright-service  JS-rendering microservice; also shared on
#                         llm-network and host port PLAYWRIGHT_HOST_PORT
#                         for non-docker consumers
#   - redis / rabbitmq / nuq-postgres   queue + rate-limit infra
#
# External dependencies (already running on this host, attached via the
# pre-existing `llm-network` docker network):
#   - `ollama`  container  -> powers /v1/extract + interact prompt planning
#   - `searxng` container  -> powers /v1/search
#
# All ${VARS} come from .env — copy .env.example first; this file has no
# fallback defaults.
#
# On a fresh host, create them with:
#   docker network create llm-network
#   docker run -d --name ollama  --network llm-network -p 11434:11434 \
#     -e OLLAMA_KEEP_ALIVE=-1 \   # keep models resident (big models are slow to cold-load)
#     -v ollama-data:/root/.ollama ollama/ollama
#   docker exec ollama ollama pull llama3.1:8b
#   docker exec ollama ollama pull nomic-embed-text
#   # For better interact prompt-mode results, pull a bigger instruct model
#   # (e.g. qwen2.5:32b-instruct) and set OLLAMA_MODEL in .env.
#   docker run -d --name searxng --network llm-network -p 8088:8080 \
#     -v ./searxng:/etc/searxng searxng/searxng   # see searxng/settings.yml
# Or point OLLAMA_BASE_URL / SEARXNG_ENDPOINT at any reachable instance
# (e.g. http://host.docker.internal:11434).

x-firecrawl-service: &firecrawl-service
  networks:
    - backend
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-firecrawl-env: &firecrawl-env
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  POSTGRES_DB: ${POSTGRES_DB}
  POSTGRES_HOST: nuq-postgres
  POSTGRES_PORT: "5432"
  USE_DB_AUTHENTICATION: "false"
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE}
  # LLM wiring -> Ollama (OpenAI-compatible endpoint)
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  OPENAI_API_KEY: ollama
  MODEL_NAME: ${OLLAMA_MODEL}
  MODEL_EMBEDDING_NAME: ${OLLAMA_EMBEDDING_MODEL}
  # Search wiring -> SearXNG (JSON output must be enabled)
  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}
  LOGGING_LEVEL: ${LOGGING_LEVEL}
  ENV: local

services:
  # -------------------------------------------------------------------------
  # External interface 1: unified REST gateway (only published REST port)
  # -------------------------------------------------------------------------
  gateway:
    <<: *firecrawl-service
    container_name: firecrawl-extended-gateway
    build: ./gateway
    networks:
      - backend
      - llm-network   # so GET /status can probe ollama + searxng
      - app-network   # shared network; consumers (rag-backend, isitcanadian-backend)
                    # reach this gateway as firecrawl-extended-gateway:8080
    environment:
      PORT: "8080"
      FIRECRAWL_API_URL: http://api:3002
      INTERACT_SERVICE_URL: http://interact:3001
      # Internal probes powering the console status pills (GET /status)
      PLAYWRIGHT_SERVICE_URL: http://playwright-service:3000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS}
      SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
      # All gateway calls require `Authorization: Bearer <key>` unless
      # ALLOW_UNAUTHENTICATED=true explicitly opts out (refuses to boot
      # without one or the other).
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      ALLOW_UNAUTHENTICATED: ${ALLOW_UNAUTHENTICATED}
    ports:
      - "${GATEWAY_PORT}:8080"
    depends_on:
      api:
        condition: service_started
      interact:
        condition: service_started

  # -------------------------------------------------------------------------
  # External interface 2: MCP server (Streamable HTTP transport)
  # -------------------------------------------------------------------------
  mcp:
    <<: *firecrawl-service
    container_name: firecrawl-extended-mcp
    build: ./mcp
    environment:
      PORT: "8081"
      GATEWAY_URL: http://gateway:8080
      GATEWAY_API_KEY: ${GATEWAY_API_KEY}
      ALLOW_UNAUTHENTICATED: ${ALLOW_UNAUTHENTICATED}
    ports:
      - "${MCP_PORT}:8081"
    depends_on:
      gateway:
        condition: service_started

  # -------------------------------------------------------------------------
  # Interact service: stateful Playwright sessions + Ollama action planner
  # -------------------------------------------------------------------------
  interact:
    <<: *firecrawl-service
    container_name: firecrawl-extended-interact
    build: ./interact
    networks:
      - backend
      - llm-network
    environment:
      PORT: "3001"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS}
      SESSION_TTL_MS: ${INTERACT_SESSION_TTL_MS}
      MAX_SESSIONS: ${INTERACT_MAX_SESSIONS}
      JOB_TTL_MS: ${INTERACT_JOB_TTL_MS}
      # Vision model describing page screenshots during prompt-mode agent
      # steps (empty disables; per-request "vision" overrides)
      INTERACT_VISION_MODEL: ${INTERACT_VISION_MODEL}
      # Set to 1 to abort tracker/ad requests in every interact session
      INTERACT_ADBLOCK: ${INTERACT_ADBLOCK}
      # Comma-separated browser launch args retried when a goto fails.
      INTERACT_FALLBACK_LAUNCH_ARGS: ${INTERACT_FALLBACK_LAUNCH_ARGS}
      # SSRF guard (default-on): targets resolving to private/internal
      # addresses are refused; set to 1 to allow internal browsing.
      INTERACT_ALLOW_PRIVATE: ${INTERACT_ALLOW_PRIVATE}
      ARTIFACT_DIR: /artifacts
    volumes:
      # Session artifacts (traces, HARs, videos, downloads) on the host.
      - ./data/artifacts:/artifacts
    # Headless Chromium needs a bit of shared memory
    shm_size: "1gb"

  # -------------------------------------------------------------------------
  # Upstream Firecrawl API + embedded workers (harness)
  # -------------------------------------------------------------------------
  api:
    <<: *firecrawl-service
    container_name: firecrawl-extended-api
    # Pinned digest (was :latest) — upstream drift has broken CI before.
    image: ghcr.io/firecrawl/firecrawl@sha256:ffec7db3599eb9594327e3abcf3212c57aa98c48392dd2ed67f9cd786f19fc8d
    networks:
      - backend
      - llm-network
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      <<: *firecrawl-env
      HOST: "0.0.0.0"
      PORT: "3002"
      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"
      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672
      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS}
    command: node dist/src/harness.js --start-docker
    # Intentionally NOT published: reachable only through the gateway.
    expose:
      - "3002"
    depends_on:
      redis:
        condition: service_started
      playwright-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      nuq-postgres:
        condition: service_healthy
    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G

  # -------------------------------------------------------------------------
  # JS-rendering microservice. Also shared: reachable on llm-network and
  # published on the host at PLAYWRIGHT_HOST_PORT for non-docker consumers.
  # -------------------------------------------------------------------------
  playwright-service:
    <<: *firecrawl-service
    container_name: playwright-service
    # Pinned digest (was :latest).
    image: ghcr.io/firecrawl/playwright-service@sha256:645387a4e7ba418ba5125e98185ef5ce3e597d537465048f5345eb604102d68f
    networks:
      - backend
      - llm-network
    environment:
      PORT: "3000"
      BLOCK_MEDIA: ${BLOCK_MEDIA}
      MAX_CONCURRENT_PAGES: ${MAX_CONCURRENT_PAGES}
      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
    ports:
      # Localhost-only by default — this endpoint has no auth. Set
      # PLAYWRIGHT_BIND=0.0.0.0 only if LAN consumers truly need it.
      - "${PLAYWRIGHT_BIND}:${PLAYWRIGHT_HOST_PORT}:3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: "1gb"
    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G
    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

  redis:
    <<: *firecrawl-service
    container_name: firecrawl-extended-redis
    image: redis:alpine
    command: redis-server --bind 0.0.0.0 --appendonly yes
    volumes:
      - ./data/redis:/data

  rabbitmq:
    <<: *firecrawl-service
    container_name: firecrawl-extended-rabbitmq
    image: rabbitmq:3-management
    command: rabbitmq-server
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

  nuq-postgres:
    <<: *firecrawl-service
    container_name: firecrawl-extended-nuq-postgres
    # Pinned digest (was :latest).
    image: ghcr.io/firecrawl/nuq-postgres@sha256:9b638af78d99873bc0ba2b57c9cbcd01df6ce96efeaa72d36cfbe0f76521e8fc
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  backend:
    driver: bridge
  # Pre-existing network hosting the `ollama` and `searxng` containers.
  llm-network:
    external: true
  # Shared consumer network — lets other stacks reach the gateway without
  # publishing the internal api port.
  app-network:
    external: true
